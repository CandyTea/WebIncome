<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><meta name="robots" content="noindex,nofollow"><title>登录 · 流水查询</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/portal.css"></head><body><main class="portal login"><img src="/icon.svg" width="48" height="48" alt=""><h1>{{ '管理员登录' if public_view else '流水查询' }}</h1><p class="intro">{{ '查询流水无需登录。输入管理员密码以上传或更新 Excel。' if public_view else '输入访问密码，查看司机每日流水。' }}</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><label for="password">{{ '管理员密码' if public_view else '访问密码' }}</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus>{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}<button class="primary" type="submit">{{ '管理员登录' if public_view else '登录' }}</button></form><p class="subtle">{{ '查看页只读；上传或更新 Excel 需要管理员密码。' if public_view else '管理员使用管理密码登录后，可以直接上传 Excel。' }}</p></main></body></html>
